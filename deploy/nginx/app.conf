server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Medical reports can be several MB (the backend accepts up to 20 MB); nginx's default is 1 MB
    client_max_body_size 25m;

    # Serve frontend (built into /usr/share/nginx/html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replies are streamed as the local model writes them, which can be slow on a CPU
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
